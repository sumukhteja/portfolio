<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Portfolio site rendered from content files." />
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg" />
  <link rel="stylesheet" href="static/site.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 id="name">Loading…</h1>
      <p class="role" id="title"></p>
      <p class="meta" id="meta"></p>
      <p class="avail" id="availability"></p>
      <nav id="links"></nav>
    </header>

    <section>
      <h2>About</h2>
      <div class="prose" id="about"></div>
    </section>

    <section>
      <h2>Experience</h2>
      <div id="experience"></div>
    </section>

    <section>
      <h2>Projects</h2>
      <div id="projects"></div>
    </section>

    <section>
      <h2>Skills</h2>
      <div id="skills"></div>
    </section>

    <section>
      <h2>Education</h2>
      <div class="prose" id="education"></div>
    </section>

    <section>
      <h2>Volunteering & Certifications</h2>
      <div class="prose" id="volunteering"></div>
    </section>

    <section>
      <h2>Contact</h2>
      <form id="contact-form" novalidate>
        <div class="row">
          <label>Name<input name="name" required autocomplete="name" /></label>
          <label>Email<input name="email" type="email" required autocomplete="email" /></label>
        </div>
        <label>Message<textarea name="message" rows="4" required minlength="10"></textarea></label>
        <button type="submit">Send</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </section>

    <footer>
      <p id="footer-email"></p>
      <p class="fine">Static deployment on Cloudflare Pages · &copy; <span id="year"></span> Portfolio</p>
    </footer>
  </div>

  <script src="static/portfolio.js" type="module"></script>
</body>
</html>

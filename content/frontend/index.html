<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_name }} — Portfolio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <!-- The workbench shell. Everything inside is painted by app.js
       from /api/content, so the markup stays this small. -->
  <header class="titlebar">
    <span class="traffic"><i></i><i></i><i></i></span>
    <span class="title">portfolio — Visual Studio Code</span>
  </header>

  <div class="workbench">
    <nav class="activitybar" id="activitybar"></nav>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="editor-area">
      <div class="tabs" id="tabs"></div>
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div class="editor" id="editor"></div>
      <section class="panel" id="panel"></section>
    </main>
  </div>

  <footer class="statusbar" id="statusbar"></footer>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
